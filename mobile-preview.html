<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem thử giao diện điện thoại</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; background: #e8edf4; color: #1f2937; font: 16px/1.5 Arial, sans-serif; text-align: center; }
    main { max-width: 520px; margin: auto; padding: 32px; border-radius: 16px; background: white; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; color: white; background: #1d4ed8; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 3px; }
    #status { color: #475569; }
  </style>
</head>
<body>
  <main>
    <h1>Xem thử giao diện điện thoại</h1>
    <p>Mở website trong một cửa sổ riêng có chiều rộng điện thoại. Đăng nhập Google được thực hiện trực tiếp trong cửa sổ này.</p>
    <button id="openPreview" type="button">Mở cửa sổ điện thoại</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById("openPreview").addEventListener("click", () => {
      const preview = window.open("./index.html", "quizMobilePreview", "popup=yes,width=390,height=844,resizable=yes,scrollbars=yes");
      document.getElementById("status").textContent = preview
        ? "Đã mở cửa sổ xem thử. Sau khi đăng nhập, bạn có thể tiếp tục trong cửa sổ đó."
        : "Trình duyệt đã chặn cửa sổ. Hãy cho phép cửa sổ bật lên rồi thử lại.";
      if (preview) preview.focus();
    });
  </script>
</body>
</html>
